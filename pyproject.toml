[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "chemstractor"
version = "0.1.0"
dependencies = [
    "click",
    "docling",
    "google-genai",
    "inquirer",
    "ollama",
    "openpyxl",
    "pandas",
    "pydantic",
    "pymupdf",
    "python-dotenv",
    "rich",
    "plotly",
    "kaleido",
    "onnxruntime-directml==1.24.4; sys_platform == 'win32'",
    "onnxruntime-gpu==1.24.4; sys_platform == 'linux'"
]